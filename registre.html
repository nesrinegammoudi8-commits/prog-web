<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription ESEN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="register-page">

<header class="title">Inscription Étudiant</header>

<main class="card">
  <form onsubmit="return verifierInscription()">
    <h2 class="h2">Créer un compte</h2>
    <div class="form-group">
        <input id="nom" placeholder="Nom">
    </div>
    <div class="form-group">
        <input id="prenom" placeholder="Prénom">
    </div>
    <div class="form-group">
        <input id="mail" type="email" placeholder="Email ESEN">
    </div>
    <div class="form-group">
        <input id="pass" type="password" placeholder="Mot de passe">
    </div>
    <div class="form-group">
        <input id="confirm" type="password" placeholder="Confirmation">
    </div>

    <button type="submit" class="btn">
      S'inscrire
    </button>
  </form>
</main>

<script src="script.js"></script>
</body>
</html>
