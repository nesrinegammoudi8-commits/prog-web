<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion | ESEN</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<main>
  <div class="card">
    <h2 class="h2">Connexion Étudiant</h2>

    <form id="loginForm" onsubmit="return verifierLogin() && login();">
        <div class="form-group">
            <input id="email" type="text" placeholder="Email (ex: test@esen.com)">
        </div>
        <div class="form-group">
            <input id="password" type="password" placeholder="Mot de passe">
        </div>
      <button type="submit" class="btn">
        Se connecter
      </button>
    </form>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
